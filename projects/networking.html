HEX_DIGITS   = "0123456789ABCDEF"
SUPERSCRIPTS = str.maketrans("0123456789", "⁰¹²³⁴⁵⁶⁷⁸⁹")

def sup(n):
    return str(n).translate(SUPERSCRIPTS)


# ── CONVERSION HELPERS ────────────────────────────────────────────────────────

def decimal_to_binary_str(n):
    return f"{n:08b}"

def decimal_to_hex_str(n):
    if n == 0:
        return "0"
    result = ""
    while n > 0:
        result = HEX_DIGITS[n % 16] + result
        n //= 16
    return result

def int_to_dotted(n):
    return str(ipaddress.IPv4Address(n))

def format_time(seconds: int) -> str:
    m, s = divmod(max(0, seconds), 60)
    return f"{m:02d}:{s:02d}"

def get_rank(pct: float) -> str:
    if pct >= 90:   return "Excellent"
    elif pct >= 80: return "Good"
    elif pct >= 70: return "Satisfactory"
    elif pct >= 60: return "Marginal"
    else:           return "Needs improvement"


# ── BINARY TABLE HTML ─────────────────────────────────────────────────────────

def binary_table_html(n):
    """Render a colour-coded binary place-value table like the reference image."""
    bits   = decimal_to_binary_str(n)
    powers = [7, 6, 5, 4, 3, 2, 1, 0]
    values = [128, 64, 32, 16, 8, 4, 2, 1]
    hdr = "".join(f"<th>2{sup(p)}</th>" for p in powers)
    val = "".join(f"<td>{v}</td>" for v in values)
    bit_cells = ""
    for b in bits:
        bg = "#2e5c3a" if b == "1" else "#2a2a2a"
        fc = "#5ec47a" if b == "1" else "#888"
        bit_cells += f'<td style="background:{bg};color:{fc};font-weight:700;">{b}</td>'
    return f"""
<table style="border-collapse:collapse;width:100%;font-size:0.82rem;font-family:monospace;margin-top:0.6rem;">
  <tr style="background:#1a2233;color:#7aaee8;">{hdr}</tr>
  <tr style="background:#252525;color:#ccc;">{val}</tr>
  <tr>{bit_cells}</tr>
</table>"""


# ── HEX TABLE HTML ────────────────────────────────────────────────────────────

def hex_table_html(n, hex_val):
    """Render a hex place-value table like the reference image."""
    digits = list(hex_val)
    length = len(digits)
    powers = list(range(length - 1, -1, -1))
    pows16 = [16 ** p for p in powers]
    dvals  = [HEX_DIGITS.index(d) for d in digits]
    prods  = [dvals[i] * pows16[i] for i in range(length)]

    hdr   = "".join(f"<th>16{sup(p)}</th>" for p in powers)
    row1  = "".join(f"<td>{v}</td>" for v in pows16)
    row2  = "".join(f"<td>{d}</td>" for d in digits)
    row3_cells = ""
    for prod in prods:
        bg = "#2e5c3a" if prod > 0 else "#2a2a2a"
        fc = "#5ec47a" if prod > 0 else "#888"
        row3_cells += f'<td style="background:{bg};color:{fc};font-weight:700;">{prod}</td>'

    total_cell = f'<td colspan="{length}" style="text-align:right;color:#7aaee8;padding-top:4px;">'\
                 f'{"&nbsp;+&nbsp;".join(str(p) for p in prods)} = {n}</td>'
    return f"""
<table style="border-collapse:collapse;width:100%;font-size:0.82rem;font-family:monospace;margin-top:0.6rem;">
  <tr style="background:#1a2233;color:#7aaee8;">{hdr}</tr>
  <tr style="background:#252525;color:#ccc;">{row1}</tr>
  <tr style="background:#252525;color:#e0e0e0;">{row2}</tr>
  <tr>{row3_cells}</tr>
  <tr style="background:#1e1e1e;">{total_cell}</tr>
</table>"""


# ── QUESTION GENERATORS ───────────────────────────────────────────────────────

def gen_decimal_to_binary():
    n      = random.randint(1, 255)
    answer = decimal_to_binary_str(n)
    rows, temp = [], n
    while temp > 0:
        rows.append((temp, temp // 2, temp % 2))
        temp //= 2
    bits_collected = [str(r[2]) for r in rows]
    unpadded = "".join(reversed(bits_collected))
    lines = ["Divide by 2 repeatedly, collect the remainders:", ""]
    for orig, quot, rem in rows:
        lines.append(f"  {orig} ÷ 2 = {quot}  r {rem}")
    lines += [
        "",
        f"Read remainders bottom-to-top  →  {unpadded}",
        f"Pad to 8 bits (add leading 0s)  →  {answer}",
        "",
        "Each column below is a power of 2. Green cells are 1-bits that sum to your number.",
    ]
    breakdown_text = "\n".join(lines)
    breakdown_html = breakdown_text + binary_table_html(n)

    wrongs = set()
    while len(wrongs) < 3:
        w = decimal_to_binary_str(random.randint(0, 255))
        if w != answer: wrongs.add(w)
    opts = [answer] + list(wrongs)
    random.shuffle(opts)
    return {
        "question":    f"Convert {n} (decimal) to 8-bit binary:",
        "options":     {chr(65+i): v for i, v in enumerate(opts)},
        "answer_text": answer,
        "breakdown":   breakdown_html,
        "type":        "mcq",
        "unit":        "Decimal to Binary",
    }

def gen_decimal_to_hex():
    n      = random.randint(1, 10000000)
    answer = decimal_to_hex_str(n)
    rows, temp = [], n
    while temp > 0:
        rows.append((temp, temp // 16, temp % 16))
        temp //= 16
    lines = [
        "Hex uses base 16. Digits go: 0–9 then A=10 B=11 C=12 D=13 E=14 F=15.",
        "Divide by 16 repeatedly, collect the remainders:",
        "",
    ]
    for orig, quot, rem in rows:
        lines.append(f"  {orig} ÷ 16 = {quot}  r {rem}  →  {HEX_DIGITS[rem]}")
    lines += ["", f"Read remainders bottom-to-top  →  {answer}"]
    breakdown_text = "\n".join(lines)
    breakdown_html = breakdown_text + hex_table_html(n, answer)

    wrongs = set()
    while len(wrongs) < 3:
        w = decimal_to_hex_str(random.randint(1, 10000000))
        if w != answer: wrongs.add(w)
    opts = [answer] + list(wrongs)
    random.shuffle(opts)
    return {
        "question":    f"Convert {n} (decimal) to hexadecimal:",
        "options":     {chr(65+i): v for i, v in enumerate(opts)},
        "answer_text": answer,
        "breakdown":   breakdown_html,
        "type":        "mcq",
        "unit":        "Decimal to Hex",
    }

def gen_hex_to_decimal():
    n       = random.randint(1, 4095)
    hex_val = decimal_to_hex_str(n)
    digits  = list(hex_val)
    length  = len(digits)
    pos_terms  = [f"({d} × 16{sup(length-1-i)})" for i, d in enumerate(digits)]
    pow_terms  = [f"({HEX_DIGITS.index(d)} × {16**(length-1-i)})" for i, d in enumerate(digits)]
    prod_terms = [str(HEX_DIGITS.index(d) * (16 ** (length-1-i))) for i, d in enumerate(digits)]
    intro = (
        "Multiply each hex digit by its place value (power of 16), then sum.\n"
        "Place values go right to left: 16⁰=1, 16¹=16, 16²=256, ...\n"
        "Remember: A=10  B=11  C=12  D=13  E=14  F=15\n\n"
    )
    line1 = "Step 1 — Expand:   " + f"{hex_val} = " + " + ".join(pos_terms)
    line2 = "Step 2 — Evaluate: " + f"{hex_val} = " + " + ".join(pow_terms)
    line3 = "Step 3 — Multiply: " + f"{hex_val} = " + " + ".join(prod_terms)
    line4 = f"Step 4 — Sum:      {' + '.join(prod_terms)} = {n}"
    breakdown_text = intro + "\n".join([line1, line2, line3, line4])
    breakdown_html = breakdown_text + hex_table_html(n, hex_val)

    wrongs = set()
    while len(wrongs) < 3:
        w = random.randint(1, 4095)
        if w != n: wrongs.add(str(w))
    opts = [str(n)] + list(wrongs)
    random.shuffle(opts)
    return {
        "question":    f"Convert {hex_val} (hexadecimal) to decimal:",
        "options":     {chr(65+i): v for i, v in enumerate(opts)},
        "answer_text": str(n),
        "breakdown":   breakdown_html,
        "type":        "mcq",
        "unit":        "Hex to Decimal",
    }

def gen_binary_dotted_decimal():
    octets     = [random.randint(0, 255) for _ in range(4)]
    binary_ip  = ".".join(decimal_to_binary_str(o) for o in octets)
    decimal_ip = ".".join(str(o) for o in octets)
    lines = ["Each octet is 8 bits. Add the place values (128, 64, 32...) where the bit = 1:", ""]
    for i, o in enumerate(octets):
        bits  = decimal_to_binary_str(o)
        terms = [f"{b}×2{sup(7-j)}" for j, b in enumerate(bits) if b == "1"]
        expr  = " + ".join(terms) if terms else "0"
        lines.append(f"  Octet {i+1}:  {bits}  =  {expr}  =  {o}")
    # Each table followed by a decimal result label
    tables_html = ""
    for o in octets:
        tables_html += binary_table_html(o)
        tables_html += f'<div style="text-align:right;font-size:0.85rem;color:#7aaee8;font-family:monospace;margin-top:0.25rem;margin-bottom:0.75rem;">= <strong>{o}</strong></div>'
    breakdown_html = tables_html + "\n" + "\n".join(lines)

    wrongs = set()
    while len(wrongs) < 3:
        w = ".".join(str(random.randint(0, 255)) for _ in range(4))
        if w != decimal_ip: wrongs.add(w)
    opts = [decimal_ip] + list(wrongs)
    random.shuffle(opts)
    return {
        "question":    f"Convert this binary IP to dotted decimal:\n{binary_ip}",
        "options":     {chr(65+i): v for i, v in enumerate(opts)},
        "answer_text": decimal_ip,
        "breakdown":   breakdown_html,
        "type":        "mcq",
        "unit":        "Binary to Dotted Decimal",
    }


# ── SUBNETTING CORE ───────────────────────────────────────────────────────────

def build_subnet_data():
    ip_class = random.choice(["A", "B", "C"])
    if ip_class == "A":
        first = random.randint(1, 126);   cidr = random.randint(9, 30)
    elif ip_class == "B":
        first = random.randint(128, 191); cidr = random.randint(17, 30)
    else:
        first = random.randint(192, 223); cidr = random.randint(25, 30)

    ip_int        = (first << 24) | (random.randint(0,255) << 16) | (random.randint(0,255) << 8) | random.randint(0,255)
    mask_int      = (0xFFFFFFFF << (32 - cidr)) & 0xFFFFFFFF
    network_int   = ip_int & mask_int
    broadcast_int = network_int | (~mask_int & 0xFFFFFFFF)

    class_default = {"A": 8, "B": 16, "C": 24}[ip_class]
    subnet_bits   = cidr - class_default
    host_bits     = 32 - cidr

    ip_str      = int_to_dotted(ip_int)
    mask_str    = int_to_dotted(mask_int)
    network_str = int_to_dotted(network_int)   # Network ID (magic number result)
    bcast_str   = int_to_dotted(broadcast_int)
    first_host  = int_to_dotted(network_int + 1)
    last_host   = int_to_dotted(broadcast_int - 1)
    num_subnets = 2 ** subnet_bits
    num_hosts   = max(0, (2 ** host_bits) - 2)



    mask_octets = [int(x) for x in mask_str.split(".")]
    for oi, mo in enumerate(mask_octets):
        if mo != 255:
            magic = 256 - mo
            interesting_octet = oi
            break
    else:
        magic = 1; interesting_octet = 3

    ip_octets      = [int(x) for x in ip_str.split(".")]
    network_octets = [int(x) for x in network_str.split(".")]
    host_val       = ip_octets[interesting_octet]
    subnet_val     = network_octets[interesting_octet]

    blocks = [subnet_val - magic * i for i in range(3, -1, -1)] + [subnet_val + magic * i for i in range(1, 4)]
    blocks = sorted(set(b for b in blocks if 0 <= b <= 255))[:6]
    block_str = "(" + ", ".join(str(b) for b in blocks) + ", ...)"

    return {
        "ip": ip_str, "mask": mask_str, "cidr": cidr, "ip_class": ip_class,
        "class_default": class_default, "subnet_id": network_str,
        "broadcast": bcast_str, "first_host": first_host, "last_host": last_host,
        "num_subnets": num_subnets, "num_hosts": num_hosts,
        "host_bits": host_bits, "subnet_bits": subnet_bits,
        "magic": magic, "interesting_octet": interesting_octet,
        "host_val": host_val, "subnet_val": subnet_val, "block_str": block_str,
    }

def make_subnet_explanations(d):
    ip    = d["ip"];   mask  = d["mask"];  cidr  = d["cidr"]
    cls   = d["ip_class"]; cd = d["class_default"]
    sbits = d["subnet_bits"]; hbits = d["host_bits"]
    magic = d["magic"]; hval = d["host_val"]; sval = d["subnet_val"]
    bstr  = d["block_str"]; bcast = d["broadcast"]
    bcast_oct = int(bcast.split(".")[d["interesting_octet"]])
    expls = {}

    first_oct = int(ip.split('.')[0])
    expls["ip_class"] = (
        f"The IP class is determined by the first octet:\n"
        f"  Class A:  1 – 126\n"
        f"  Class B:  128 – 191\n"
        f"  Class C:  192 – 223\n"
        f"First octet of {ip} is {first_oct}  →  Class {cls}"
    )

    mask_oct_val = 256 - magic
    octet_names  = ["1st", "2nd", "3rd", "4th"]
    octet_label  = octet_names[d["interesting_octet"]]
    bcast_octets = bcast.split(".")
    bcast_suffix = ".".join(bcast_octets[d["interesting_octet"]+1:])
    has_suffix   = bool(bcast_suffix)

    suffix_line = "\n   (remaining octets after the interesting one → 0)" if has_suffix else ""
    expls["subnet_id"] = (
        f"The mask octet is the first octet in the mask that isn't 255.\n"
        f"1. Mask octet = {mask_oct_val}  →  block size = 256 – {mask_oct_val} = {magic}\n"
        f"   (Subnets repeat every {magic} addresses in the {octet_label} octet)\n"
        f"2. Count up in steps of {magic} until you pass {hval}  →  the last step before passing is your subnet\n"
        f"   Blocks: {bstr}{suffix_line}\n"
        f"   {hval} is in the {sval} block  →  Network ID = {d['subnet_id']}"
    )
    suffix_line2 = "\n   (all octets to the right of the interesting one fill with 255)" if has_suffix else ""
    expls["broadcast"] = (
        f"The broadcast is the last address in the subnet (all host bits = 1).\n"
        f"1. Find the next subnet: {sval} + {magic} = {sval + magic}\n"
        f"2. Broadcast = one before that: {sval + magic} – 1 = {bcast_oct} in the {octet_label} octet{suffix_line2}\n"
        f"3. Broadcast = {bcast}"
    )
    expls["host_range"] = (
        f"Host bits are the bits NOT used by the mask (the 0s on the right).\n"
        f"We subtract 2 because the Network ID and broadcast are reserved and unusable.\n"
        f"1. Host bits = 32 – /{cidr} = {hbits}\n"
        f"2. Usable hosts = 2{sup(hbits)} – 2 = {d['num_hosts']}\n"
        f"3. First host = Network ID + 1  =  {d['first_host']}\n"
        f"   Last host  = broadcast – 1  =  {d['last_host']}"
    )
    expls["num_subnets"] = (
        f"Subnetting 'borrows' bits from the host portion to create more networks.\n"
        f"Class {cls} has a default mask of /{cd} — any bits beyond that are borrowed.\n"
        f"1. Borrowed bits = /{cidr} – /{cd} = {sbits}\n"
        f"2. Number of subnets = 2{sup(sbits)} = {d['num_subnets']}"
    )
    expls["num_hosts"] = (
        f"Host bits are the 0s on the right side of the mask.\n"
        f"We subtract 2 to exclude the Network ID and Broadcast Address.\n"
        f"1. Host bits = 32 – /{cidr} = {hbits}\n"
        f"2. Usable hosts = 2{sup(hbits)} – 2 = {d['num_hosts']}"
    )
    return expls

def subnet_question_prefix(d):
    return f"Given:\n  IP:   {d['ip']}\n  Mask: {d['mask']}  (/{d['cidr']})"

def _subnet_wrong_ips(correct, n=3):
    parts = [int(x) for x in correct.split(".")]
    wrongs = set()
    while len(wrongs) < n:
        i = random.randint(0, 3)
        delta = random.choice([-64, -32, -16, 16, 32, 64, 1, -1, 2, -2])
        np2 = parts[:]
        np2[i] = max(0, min(255, np2[i] + delta))
        w = ".".join(str(x) for x in np2)
        if w != correct: wrongs.add(w)
    return list(wrongs)

def gen_subnet_class():
    d     = build_subnet_data()
    expls = make_subnet_explanations(d)
    opts  = {"A": "A", "B": "B", "C": "C"}
    return {
        "question":    subnet_question_prefix(d) + "\n\nWhat is the IP class?",
        "options":     opts,
        "answer_text": d["ip_class"],
        "breakdown":   expls["ip_class"],
        "type":        "mcq",
        "unit":        "Subnet: IP Class",
        "subnet_data": d,
    }

def gen_subnet_ids():
    d     = build_subnet_data()
    expls = make_subnet_explanations(d)
    answer = f"Net ID: {d['subnet_id']}  |  Broadcast: {d['broadcast']}"
    wrongs = set()
    while len(wrongs) < 3:
        bs = _subnet_wrong_ips(d["subnet_id"],  1)[0]
        bb = _subnet_wrong_ips(d["broadcast"],  1)[0]
        w  = f"Net ID: {bs}  |  Broadcast: {bb}"
        if w != answer: wrongs.add(w)
    opts = [answer] + list(wrongs)
    random.shuffle(opts)
    breakdown = expls["subnet_id"] + "\n\n" + expls["broadcast"]
    return {
        "question":    subnet_question_prefix(d) + "\n\nWhat are the Network ID and Broadcast Address?",
        "options":     {chr(65+i): v for i, v in enumerate(opts)},
        "answer_text": answer,
        "breakdown":   breakdown,
        "type":        "mcq",
        "unit":        "Subnet: Network & Network ID & Broadcast",
        "subnet_data": d,
    }

def gen_subnetting_all():

def gen_subnet_full():
    """Full breakdown question — all fields as text inputs."""
    d     = build_subnet_data()
    expls = make_subnet_explanations(d)
    # Build a combined breakdown string for the review screen
    breakdown = "\n\n".join(expls[k] for k in ["ip_class","subnet_id","broadcast","host_range","num_subnets","num_hosts"])
    return {
        "question":    subnet_question_prefix(d) + "\n\nFill in all fields:",
        "type":        "subnet_full",
        "unit":        "Subnetting",
        "subnet_data": d,
        "breakdown":   breakdown,
        "fields": [
            ("ip_class",    "IP Class (Enter the single letter)",              d["ip_class"]),
            ("subnet_id",   "Network ID",              d["subnet_id"]),
            ("broadcast",   "Broadcast Address",      d["broadcast"]),
            ("first_host",  "First Usable Host",      d["first_host"]),
            ("last_host",   "Last Usable Host",       d["last_host"]),
            ("num_subnets", "Number of Subnets",      str(d["num_subnets"])),
            ("num_hosts",   "Number of Usable Hosts", str(d["num_hosts"])),
        ],
        "explanations": expls,

# ── POOL GENERATOR ────────────────────────────────────────────────────────────

GENERATORS = {
    "Decimal to Binary":                       gen_decimal_to_binary,
    "Decimal to Hex":                          gen_decimal_to_hex,
    "Hex to Decimal":                          gen_hex_to_decimal,
    "Binary to Dotted Decimal":                gen_binary_dotted_decimal,
    "Subnetting":                              gen_subnetting_all,
    "Subnet: IP Class":                        gen_subnet_class,
    "Subnet: Network & Network ID & Broadcast": gen_subnet_ids,
    "Subnet: Host Range":                      gen_subnet_host_range,
    "Subnet: Number of Subnets":               gen_subnet_num_subnets,
    "Subnet: Number of Hosts":                 gen_subnet_num_hosts,
}

ALL_COMPOSITION = (
    [gen_binary_dotted_decimal] * 2 +
    [gen_hex_to_decimal]        * 2 +
    [gen_decimal_to_hex]        * 2 +
    [gen_subnet_full]           * 14
)
ALL_TOTAL      = 20
ALL_PASS_SCORE = 16

def generate_question_pool(unit: str, n: int) -> list:
    if unit == "All":
        gens = ALL_COMPOSITION[:]
        random.shuffle(gens)
        questions = [g() for g in gens]
    else:
        questions = [GENERATORS[unit]() for _ in range(n)]
    for i, q in enumerate(questions):
        q["id"] = f"q{i}_{random.randint(0, 99999)}"
    return questions
