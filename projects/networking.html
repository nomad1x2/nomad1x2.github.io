HEX_DIGITS   = "0123456789ABCDEF"
SUPERSCRIPTS = str.maketrans("0123456789", "⁰¹²³⁴⁵⁶⁷⁸⁹")

def sup(n):
    return str(n).translate(SUPERSCRIPTS)


# ── CONVERSION HELPERS ────────────────────────────────────────────────────────

def decimal_to_binary_str(n):
    return f"{n:08b}"

def decimal_to_hex_str(n):
    if n == 0:
        return "0"
    result = ""
    while n > 0:
        result = HEX_DIGITS[n % 16] + result
        n //= 16
    return result

def int_to_dotted(n):
    return str(ipaddress.IPv4Address(n))

def format_time(seconds: int) -> str:
    m, s = divmod(max(0, seconds), 60)
    return f"{m:02d}:{s:02d}"

def get_rank(pct: float) -> str:
    if pct >= 90:   return "Excellent"
    elif pct >= 80: return "Good"
    elif pct >= 70: return "Satisfactory"
    elif pct >= 60: return "Marginal"
    else:           return "Needs improvement"


# ── BINARY TABLE HTML ─────────────────────────────────────────────────────────

def binary_table_html(n):
    if n == 0:
        bit_count = 1
    else:
        bit_count = n.bit_length()

    powers = list(range(bit_count - 1, -1, -1))
    values = [2 ** p for p in powers]
    bits   = format(n, f'0{bit_count}b')

    def td(content, style=""):
        return f'<td style="{style}">{content}</td>'

    hdr_cells = "".join(
        f'<th style="padding:4px 6px;white-space:nowrap;">2{sup(p)}</th>'
        for p in powers
    )
    val_cells = "".join(
        td(v, "padding:3px 6px;") for v in values
    )
    bit_cells = "".join(
        td(
            b,
            f"background:{'#2e5c3a' if b=='1' else '#2a2a2a'};"
            f"color:{'#5ec47a' if b=='1' else '#666'};"
            f"font-weight:700;padding:4px 6px;"
        )
        for b in bits
    )

    return (
        '<div style="overflow-x:auto;margin-top:0.6rem;">'
        '<table style="border-collapse:collapse;width:100%;font-size:0.82rem;'
        'font-family:monospace;min-width:max-content;">'
        f'<tr style="background:#1a2233;color:#7aaee8;text-align:center;">{hdr_cells}</tr>'
        f'<tr style="background:#252525;color:#ccc;text-align:center;">{val_cells}</tr>'
        f'<tr style="text-align:center;">{bit_cells}</tr>'
        '</table></div>'
    )


# ── HEX TABLE HTML ────────────────────────────────────────────────────────────

def hex_table_html(n, hex_val):
    digits = list(hex_val)
    length = len(digits)
    powers = list(range(length - 1, -1, -1))
    pows16 = [16 ** p for p in powers]
    dvals  = [HEX_DIGITS.index(d) for d in digits]
    prods  = [dvals[i] * pows16[i] for i in range(length)]

    hdr   = "".join(f"<th>16{sup(p)}</th>" for p in powers)
    row1  = "".join(f"<td>{v}</td>" for v in pows16)
    row2  = "".join(f"<td>{d}</td>" for d in digits)
    row3_cells = ""
    for prod in prods:
        bg = "#2e5c3a" if prod > 0 else "#2a2a2a"
        fc = "#5ec47a" if prod > 0 else "#888"
        row3_cells += f'<td style="background:{bg};color:{fc};font-weight:700;">{prod}</td>'

    total_cell = f'<td colspan="{length}" style="text-align:right;color:#7aaee8;padding-top:4px;">'\
                 f'{"&nbsp;+&nbsp;".join(str(p) for p in prods)} = {n}</td>'
    return f"""
<table style="border-collapse:collapse;width:100%;font-size:0.82rem;font-family:monospace;margin-top:0.6rem;">
  <tr style="background:#1a2233;color:#7aaee8;">{hdr}</tr>
  <tr style="background:#252525;color:#ccc;">{row1}</tr>
  <tr style="background:#252525;color:#e0e0e0;">{row2}</tr>
  <tr>{row3_cells}</tr>
  <tr style="background:#1e1e1e;">{total_cell}</tr>
</table>"""


# ── QUESTION GENERATORS ───────────────────────────────────────────────────────

def gen_decimal_to_binary():
    n      = random.randint(1, 100000)
    answer = decimal_to_binary_str(n)
    rows, temp = [], n
    while temp > 0:
        rows.append((temp, temp // 2, temp % 2))
        temp //= 2
    bits_collected = [str(r[2]) for r in rows]
    unpadded = "".join(reversed(bits_collected))
    lines = ["Divide by 2 repeatedly, collect the remainders:", ""]
    for orig, quot, rem in rows:
        lines.append(f"  {orig} ÷ 2 = {quot}  r {rem}")
    lines += [
        "",
        f"Read remainders bottom-to-top  →  {unpadded}",
        "",
        "Each column below is a power of 2. Green cells are 1-bits that sum to your number.",
    ]
    breakdown_html = "\n".join(lines) + binary_table_html(n)

    return {
        "question":    f"Convert {n} (decimal) to 8-bit binary:",
        "answer_text": answer,
        "breakdown":   breakdown_html,
        "type":        "text_input",
        "unit":        "Decimal to Binary",
        "placeholder": "e.g. 10110011",
    }

def gen_decimal_to_hex():
    n      = random.randint(1, 100000)
    answer = decimal_to_hex_str(n)
    rows, temp = [], n
    while temp > 0:
        rows.append((temp, temp // 16, temp % 16))
        temp //= 16
    lines = [
        "Hex uses base 16. Digits go: 0–9 then A=10 B=11 C=12 D=13 E=14 F=15.",
        "Divide by 16 repeatedly, collect the remainders:",
        "",
    ]
    for orig, quot, rem in rows:
        lines.append(f"  {orig} ÷ 16 = {quot}  r {rem}  →  {HEX_DIGITS[rem]}")
    lines += ["", f"Read remainders bottom-to-top  →  {answer}"]
    breakdown_html = "\n".join(lines) + hex_table_html(n, answer)

    return {
        "question":    f"Convert {n} (decimal) to hexadecimal:",
        "answer_text": answer,
        "breakdown":   breakdown_html,
        "type":        "text_input",
        "unit":        "Decimal to Hex",
        "placeholder": "e.g. 1A3F",
    }

def gen_hex_to_decimal():
    n       = random.randint(1, 100000)
    hex_val = decimal_to_hex_str(n)
    digits  = list(hex_val)
    length  = len(digits)
    pos_terms  = [f"({d} × 16{sup(length-1-i)})" for i, d in enumerate(digits)]
    pow_terms  = [f"({HEX_DIGITS.index(d)} × {16**(length-1-i)})" for i, d in enumerate(digits)]
    prod_terms = [str(HEX_DIGITS.index(d) * (16 ** (length-1-i))) for i, d in enumerate(digits)]
    intro = (
        "Multiply each hex digit by its place value (power of 16), then sum.\n"
        "Place values go right to left: 16⁰=1, 16¹=16, 16²=256, ...\n"
        "Remember: A=10  B=11  C=12  D=13  E=14  F=15\n\n"
    )
    line1 = "Step 1 — Expand:   " + f"{hex_val} = " + " + ".join(pos_terms)
    line2 = "Step 2 — Evaluate: " + f"{hex_val} = " + " + ".join(pow_terms)
    line3 = "Step 3 — Multiply: " + f"{hex_val} = " + " + ".join(prod_terms)
    line4 = f"Step 4 — Sum:      {' + '.join(prod_terms)} = {n}"
    breakdown_html = intro + "\n".join([line1, line2, line3, line4]) + hex_table_html(n, hex_val)

    return {
        "question":    f"Convert {hex_val} (hexadecimal) to decimal:",
        "answer_text": str(n),
        "breakdown":   breakdown_html,
        "type":        "text_input",
        "unit":        "Hex to Decimal",
        "placeholder": "e.g. 54321",
    }

def gen_binary_dotted_decimal():
    octets     = [random.randint(0, 255) for _ in range(4)]
    binary_ip  = ".".join(decimal_to_binary_str(o) for o in octets)
    decimal_ip = ".".join(str(o) for o in octets)
    lines = ["Each octet is 8 bits. Add the place values (128, 64, 32...) where the bit = 1:", ""]
    for i, o in enumerate(octets):
        bits  = decimal_to_binary_str(o)
        terms = [f"{b}×2{sup(7-j)}" for j, b in enumerate(bits) if b == "1"]
        expr  = " + ".join(terms) if terms else "0"
        lines.append(f"  Octet {i+1}:  {bits}  =  {expr}  =  {o}")
    tables_html = ""
    for o in octets:
        tables_html += binary_table_html(o)
        tables_html += f'<div style="text-align:right;font-size:0.85rem;color:#7aaee8;font-family:monospace;margin-top:0.25rem;margin-bottom:0.75rem;">= <strong>{o}</strong></div>'
    breakdown_html = tables_html + "\n" + "\n".join(lines)

    return {
        "question":    f"Convert this binary IP to dotted decimal:\n{binary_ip}",
        "answer_text": decimal_ip,
        "breakdown":   breakdown_html,
        "type":        "text_input",
        "unit":        "Binary to Dotted Decimal",
        "placeholder": "e.g. 192.168.1.1",
    }


# ── SUBNETTING CORE ───────────────────────────────────────────────────────────

def build_subnet_data():
    ip_class = random.choice(["A", "B", "C"])

    if ip_class == "A":
        first = random.randint(1, 126)
        cidr  = random.randint(9, 14)
    elif ip_class == "B":
        first = random.randint(128, 191)
        cidr  = random.randint(17, 22)
    else:
        first = random.randint(192, 223)
        cidr  = random.randint(25, 30)

    ip_int        = (first << 24) | (random.randint(0,255) << 16) | (random.randint(0,255) << 8) | random.randint(0,255)
    mask_int      = (0xFFFFFFFF << (32 - cidr)) & 0xFFFFFFFF
    network_int   = ip_int & mask_int
    broadcast_int = network_int | (~mask_int & 0xFFFFFFFF)

    ip_str      = int_to_dotted(ip_int)
    mask_str    = int_to_dotted(mask_int)
    network_str = int_to_dotted(network_int)
    bcast_str   = int_to_dotted(broadcast_int)
    first_host  = int_to_dotted(network_int + 1)
    last_host   = int_to_dotted(broadcast_int - 1)

    mask_octets = [int(x) for x in mask_str.split(".")]
    for oi, mo in enumerate(mask_octets):
        if mo != 255:
            magic = 256 - mo
            interesting_octet = oi
            break
    else:
        magic = 1; interesting_octet = 3

    classful_boundary     = {"A": 8, "B": 16, "C": 24}[ip_class]
    classful_default_mask = {8: "255.0.0.0", 16: "255.255.0.0", 24: "255.255.255.0"}[classful_boundary]
    borrowed_bits         = cidr - classful_boundary
    num_subnets           = 2 ** borrowed_bits

    host_bits = 32 - cidr
    num_hosts = max(0, (2 ** host_bits) - 2)

    ip_octets      = [int(x) for x in ip_str.split(".")]
    network_octets = [int(x) for x in network_str.split(".")]
    host_val       = ip_octets[interesting_octet]
    subnet_val     = network_octets[interesting_octet]

    blocks = [subnet_val - magic * i for i in range(3, -1, -1)] + [subnet_val + magic * i for i in range(1, 4)]
    blocks = sorted(set(b for b in blocks if 0 <= b <= 255))[:6]
    block_str = "(" + ", ".join(str(b) for b in blocks) + ", ...)"

    classful_mask_int    = (0xFFFFFFFF << (32 - classful_boundary)) & 0xFFFFFFFF
    classful_network_str = int_to_dotted(ip_int & classful_mask_int)

    return {
        "ip": ip_str, "mask": mask_str, "cidr": cidr, "ip_class": ip_class,
        "classful_boundary": classful_boundary, "classful_default_mask": classful_default_mask,
        "borrowed_bits": borrowed_bits,
        "subnet_id": network_str,
        "classful_network_id": classful_network_str,
        "broadcast": bcast_str,
        "first_host": first_host, "last_host": last_host,
        "num_subnets": num_subnets, "num_hosts": num_hosts,
        "host_bits": host_bits,
        "magic": magic, "interesting_octet": interesting_octet,
        "host_val": host_val, "subnet_val": subnet_val, "block_str": block_str,
    }

def make_subnet_explanations(d):
    ip    = d["ip"];  cidr  = d["cidr"]
    hbits = d["host_bits"]
    magic = d["magic"]; hval = d["host_val"]; sval = d["subnet_val"]
    bstr  = d["block_str"]; bcast = d["broadcast"]
    bcast_oct = int(bcast.split(".")[d["interesting_octet"]])
    expls = {}

    octet_names  = ["1st", "2nd", "3rd", "4th"]
    octet_label  = octet_names[d["interesting_octet"]]
    mask_oct_val = 256 - magic
    bcast_octets = bcast.split(".")
    bcast_suffix = ".".join(bcast_octets[d["interesting_octet"]+1:])
    has_suffix   = bool(bcast_suffix)

    suffix_line = "\n   (remaining octets after the interesting one → 0)" if has_suffix else ""
    expls["subnet_id"] = (
        f"The mask octet is the first octet in the mask that isn't 255.\n"
        f"1. Mask octet = {mask_oct_val}  →  block size = 256 – {mask_oct_val} = {magic}\n"
        f"   (Subnets repeat every {magic} addresses in the {octet_label} octet)\n"
        f"2. Count up in steps of {magic} until you pass {hval}  →  the last step before passing is your subnet\n"
        f"   Blocks: {bstr}{suffix_line}\n"
        f"   {hval} is in the {sval} block  →  Network ID = {d['subnet_id']}"
    )
    suffix_line2 = "\n   (all octets to the right of the interesting one fill with 255)" if has_suffix else ""
    expls["broadcast"] = (
        f"The broadcast is the last address in the subnet (all host bits = 1).\n"
        f"1. Find the next subnet: {sval} + {magic} = {sval + magic}\n"
        f"2. Broadcast = one before that: {sval + magic} – 1 = {bcast_oct} in the {octet_label} octet{suffix_line2}\n"
        f"3. Broadcast = {bcast}"
    )
    expls["host_range"] = (
        f"Host bits are the bits NOT used by the mask (the 0s on the right).\n"
        f"We subtract 2 because the Network ID and broadcast are reserved and unusable.\n"
        f"1. Host bits = 32 – /{cidr} = {hbits}\n"
        f"2. Usable hosts = 2{sup(hbits)} – 2 = {d['num_hosts']}\n"
        f"3. First host = Network ID + 1  =  {d['first_host']}\n"
        f"   Last host  = broadcast – 1  =  {d['last_host']}"
    )

    cb  = d["classful_boundary"]
    cdm = d["classful_default_mask"]
    bb  = d["borrowed_bits"]
    cls = d["ip_class"]
    expls["num_subnets"] = (
        f"Subnets = 2^(borrowed bits), counting borrowed bits from the classful default boundary.\n"
        f"1. First octet = {ip.split('.')[0]}  →  Class {cls}  →  default mask = {cdm} (/{cb})\n"
        f"2. Borrowed bits = /{cidr} – /{cb} = {bb}\n"
        f"3. Number of subnets = 2{sup(bb)} = {d['num_subnets']}"
    )
    expls["num_hosts"] = (
        f"Host bits are the 0s on the right side of the mask.\n"
        f"We subtract 2 to exclude the Network ID and Broadcast Address.\n"
        f"1. Host bits = 32 – /{cidr} = {hbits}\n"
        f"2. Usable hosts = 2{sup(hbits)} – 2 = {d['num_hosts']}"
    )

    expls["ip_class"] = (
        f"Look at the first octet of the IP: {ip.split('.')[0]}\n"
        f"  1–126   → Class A\n"
        f"  128–191 → Class B\n"
        f"  192–223 → Class C\n"
        f"First octet {ip.split('.')[0]} → Class {cls}"
    )

    expls["bits_taken"] = (
        f"Bits taken = /{cidr} – classful default /{cb} = {bb}\n"
        f"  Class {cls} default boundary = /{cb} ({cdm})\n"
        f"  Subnet mask /{cidr} borrows {bb} extra bits beyond the default"
    )

    cn = d["classful_network_id"]
    expls["network_id"] = (
        f"The Network ID identifies the entire classful network.\n"
        f"It is the zero subnet — ALL bits below the classful boundary are set to 0.\n"
        f"  Class {cls} default boundary = /{cb}  →  zero out everything after octet {cb // 8}\n"
        f"  IP {ip}  →  Network ID = {cn}\n\n"
        f"There is only one Network ID per classful network.\n"
        f"It cannot be assigned to a host."
    )

    sub = d["subnet_id"]
    expls["subnet_id_field"] = (
        f"The Subnet ID identifies which subnet the host belongs to.\n"
        f"It is calculated as:  IP address  AND  Subnet mask  (bitwise AND)\n\n"
        f"  IP address:   {ip}\n"
        f"  Subnet mask:  {d['mask']}\n"
        f"  AND result:   {sub}  ← this is the Subnet ID\n\n"
        f"The AND zeroes out all host bits, leaving only the network + subnet bits.\n"
        f"The Subnet ID cannot be assigned to a host."
    )

    return expls

def subnet_question_prefix(d):
    return f"Given:\n  IP:   {d['ip']}\n  Mask: {d['mask']}  (/{d['cidr']})"


# ── SUBNET: IP INFO ───────────────────────────────────────────────────────────

def gen_subnet_ip_info():
    d     = build_subnet_data()
    expls = make_subnet_explanations(d)

    network_id = d["classful_network_id"]
    subnet_id  = d["subnet_id"]

    fields = [
        ("ip_class",   "Class  (A, B, or C)",      d["ip_class"]),
        ("bits_taken", "# of Bits Taken for Subnet", str(d["borrowed_bits"])),
        ("network_id", "Network ID",                network_id),
        ("subnet_id",  "Subnet ID",                 subnet_id),
    ]

    field_expls = {
        "ip_class":   expls["ip_class"],
        "bits_taken": expls["bits_taken"],
        "network_id": expls["network_id"],
        "subnet_id":  expls["subnet_id_field"],
    }

    full_expl = "\n\n".join(field_expls[k] for k in field_expls)

    return {
        "question": (
            f"Given the IP address and subnet mask, identify the class,\n"
            f"number of bits taken, Network ID, and Subnet ID.\n\n"
            f"  IP Address:   {d['ip']}\n"
            f"  Subnet Mask:  {d['mask']}  (/{d['cidr']})"
        ),
        "type":         "subnet_full",
        "unit":         "Subnet: IP Info",
        "breakdown":    full_expl,
        "fields":       fields,
        "explanations": field_expls,
        "answer_text":  (
            f"Class={d['ip_class']}  BitsTaken={d['borrowed_bits']}  "
            f"NetworkID={network_id}  SubnetID={subnet_id}"
        ),
    }

# ── SUBNET NUMBER QUESTIONS (MCQ) ────────────────────────────────────────────

def gen_subnet_num_subnets():
    d     = build_subnet_data()
    expls = make_subnet_explanations(d)
    answer = str(d["num_subnets"])
    bb     = d["borrowed_bits"]

    wrongs = set()
    for delta in [-2, -1, 1, 2]:
        fake_bb = bb + delta
        if fake_bb >= 1:
            w = str(2 ** fake_bb)
            if w != answer:
                wrongs.add(w)
    while len(wrongs) < 3:
        w = str(2 ** random.randint(1, 10))
        if w != answer: wrongs.add(w)

    opts = [answer] + list(wrongs)[:3]
    random.shuffle(opts)
    return {
        "question":    subnet_question_prefix(d) + "\n\nHow many subnets can be created?\n(Use the classful default boundary — Subnets = 2^borrowed bits)",
        "options":     {chr(65+i): v for i, v in enumerate(opts)},
        "answer_text": answer,
        "breakdown":   expls["num_subnets"],
        "type":        "mcq",
        "unit":        "Subnet: Number of Subnets",
        "subnet_data": d,
    }

def gen_subnet_num_hosts():
    d     = build_subnet_data()
    expls = make_subnet_explanations(d)
    answer = str(d["num_hosts"])
    hbits  = d["host_bits"]

    wrongs = set()
    w_no_sub = str(2 ** hbits)
    if w_no_sub != answer: wrongs.add(w_no_sub)
    for delta in [-1, 1]:
        fake_hb = hbits + delta
        if fake_hb >= 1:
            w = str(max(0, (2 ** fake_hb) - 2))
            if w != answer: wrongs.add(w)
    for delta in [-1, 1]:
        fake_hb = hbits + delta
        if fake_hb >= 1:
            w = str(2 ** fake_hb)
            if w != answer: wrongs.add(w)
    while len(wrongs) < 3:

        if w != answer: wrongs.add(w)

    opts = [answer] + list(wrongs)[:3]
    random.shuffle(opts)
    return {
        "question":    subnet_question_prefix(d) + "\n\nHow many usable hosts per subnet?",
        "options":     {chr(65+i): v for i, v in enumerate(opts)},
        "answer_text": answer,
        "breakdown":   expls["num_hosts"],

# ── SUBNET DESIGN (Worksheet 1) ───────────────────────────────────────────────

def _classful_default(ip_str):
    first = int(ip_str.split(".")[0])
    if 1 <= first <= 126:     return "A", 8
    elif 128 <= first <= 191: return "B", 16
    elif 192 <= first <= 223: return "C", 24
    else:                     return "?", 0

def _ip_to_int(s):
    parts = s.split(".")
    while len(parts) < 4: parts.append("0")
    return sum(int(p) << (8 * (3 - i)) for i, p in enumerate(parts))

def _interesting_octet(mask_str):
    for i, o in enumerate(mask_str.split(".")):
        if int(o) != 255:
            return i
    return 3

def _build_subnet_design_data():
    ip_class_choice = random.choice(["A", "B", "C"])
    if ip_class_choice == "A":
        first = random.randint(1, 126)
        borrowed = random.randint(2, 11)
        default_prefix = 8
    elif ip_class_choice == "B":
        first = random.randint(128, 191)
        borrowed = random.randint(2, 11)
        default_prefix = 16
    else:
        first = random.randint(192, 223)
        borrowed = random.randint(2, 6)
        default_prefix = 24

    lo = 2 ** (borrowed - 1) + 1
    hi = 2 ** borrowed
    subnets_req = random.randint(lo, hi)

    if ip_class_choice == "A":
        net_str = f"{first}.0.0.0"
    elif ip_class_choice == "B":
        second = random.randint(0, 255)
        net_str = f"{first}.{second}.0.0"
    else:
        second = random.randint(0, 255)
        third  = random.randint(0, 255)
        net_str = f"{first}.{second}.{third}.0"

    new_prefix  = default_prefix + borrowed
    mask_int    = (0xFFFFFFFF << (32 - new_prefix)) & 0xFFFFFFFF
    mask_str    = int_to_dotted(mask_int)
    block_size  = 2 ** (32 - new_prefix)
    total_sub   = 2 ** borrowed
    net_int     = _ip_to_int(net_str)
    default_mask_str = {8: "255.0.0.0", 16: "255.255.0.0", 24: "255.255.255.0"}[default_prefix]
    all_ones_id = int_to_dotted(net_int + (total_sub - 1) * block_size)

    return {
        "net_str":        net_str,
        "subnets_req":    subnets_req,
        "ip_class":       ip_class_choice,
        "default_prefix": default_prefix,
        "default_mask":   default_mask_str,
        "borrowed":       borrowed,
        "new_prefix":     new_prefix,
        "mask_str":       mask_str,
        "block_size":     block_size,
        "total_sub":      total_sub,
        "second_subnet":  int_to_dotted(net_int + block_size),
        "next_to_last":   int_to_dotted(net_int + (total_sub - 2) * block_size),
        "all_ones_id":    all_ones_id,
    }

def gen_subnet_design():
    d   = _build_subnet_design_data()
    cls = d["ip_class"]; dp = d["default_prefix"]; dm = d["default_mask"]
    bt  = d["borrowed"];  np_ = d["new_prefix"];   mask = d["mask_str"]
    req = d["subnets_req"]; ts = d["total_sub"];   bs = d["block_size"]
    net = d["net_str"];   sec = d["second_subnet"]; ntl = d["next_to_last"]

    net_int        = _ip_to_int(net)
    host_bits      = 32 - np_
    interesting_oi = _interesting_octet(mask)
    octet_inc      = bs >> (8 * (3 - interesting_oi))
    oi_label       = ["1st", "2nd", "3rd", "4th"][interesting_oi]
    mask_oct_val   = int(mask.split(".")[interesting_oi])

    def sid(i): return int_to_dotted(net_int + i * bs)
    show_n   = min(ts, 4)
    walk_str = ", ".join(sid(i) for i in range(show_n)) + (", ..." if ts > show_n else "")

    net_parts = net.split(".")
    ntl_parts = ntl.split(".")
    ao        = d["all_ones_id"]
    ao_parts  = ao.split(".")

    ao_expl = (
        f"The all-ones subnet is the last subnet in the space — every subnet bit is 1.\n"
        f"   With {bt} bits borrowed, the last subnet is index {ts-1} (= 2{sup(bt)}–1).\n"
        f"   In dotted decimal its network ID is {ao}.\n"
        f"   The {oi_label} octet = {ao_parts[interesting_oi]} "
        f"({'all subnet bits in this octet are 1' if ao_parts[interesting_oi] == str(mask_oct_val) else f'subnet bits in this octet are all 1'})."
    )

    expls = {
        "ip_class": (
            f"Look at the first octet: {net_parts[0]}\n"
            f"  1–126   → Class A\n"
            f"  128–191 → Class B\n"
            f"  192–223 → Class C\n"
            f"First octet {net_parts[0]} → Class {cls}"
        ),
        "mask_str": (
            f"Start from the classful default for Class {cls}: {dm} (/{dp})\n"
            f"Add the bits taken ({bt}) to the prefix: /{dp} + {bt} = /{np_}\n"
            f"/{np_} in dotted decimal = {mask}"
        ),
        "bits_taken": (
            f"Find the smallest power of 2 that is ≥ {req}:\n"
            f"  2{sup(bt-1)} = {2**(bt-1)} — not enough\n"
            f"  2{sup(bt)} = {ts} — ✓ covers {req} subnets\n"
            f"Bits taken = {bt}"
        ),
        "second_sub": (
            f"The subnet sequence counts up by {octet_inc} in the {oi_label} octet (magic number = 256–{mask_oct_val} = {octet_inc}):\n"
            f"  {walk_str}\n\n"
            f"Index 0 = all-zeros subnet ({net})  ←  skip this one\n"
            f"Index 1 = second subnet (1st non-zero) → add one block to the {oi_label} octet:\n"
            f"  {net}  →  {sec}"
        ),
        "ntl_sub": (
            f"{ao_expl}\n\n"
            f"Next-to-last = one block before the all-ones subnet.\n"
            f"Subtract {octet_inc} from the {oi_label} octet:  {ao_parts[interesting_oi]} – {octet_inc} = {ntl_parts[interesting_oi]}\n"
            f"  All-ones subnet:   {ao}\n"
            f"  Next-to-last:      {ntl}"
        ),
    }
    full_expl = "\n\n".join(expls[k] for k in expls)

    fields = [
        ("ip_class",   "Class",                           cls),
        ("mask_str",   "Subnet Mask",                     mask),
        ("bits_taken", "Bits Taken",                      str(bt)),
        ("second_sub", "Second Subnet ID (1st non-zero)", sec),
        ("ntl_sub",    "Next-to-Last Subnet ID",          ntl),
    ]

    return {
        "question": (
            f"Given a network address and subnets requested, fill in all fields.\n"
            f"(Assume all-zeros and all-ones subnets are usable — modern equipment.)\n\n"
            f"  Network ID:         {net}\n"
            f"  Subnets Requested:  {req}"
        ),
        "type":         "subnet_full",
        "unit":         "Subnet Design",
        "breakdown":    full_expl,
        "fields":       fields,
        "explanations": expls,
        "answer_text":  (
            f"Class={cls}  Mask={mask}  Bits={bt}  "
            f"2nd={sec}  NtL={ntl}"
        ),
    }

def _build_host_design_data():
    ip_class_choice = random.choice(["A", "B", "C"])
    if ip_class_choice == "A":
        first = random.randint(1, 126)
        default_prefix = 8
        hb = random.randint(8, 16)
    elif ip_class_choice == "B":
        first = random.randint(128, 191)
        default_prefix = 16
        hb = random.randint(4, 14)
    else:
        first = random.randint(192, 223)
        default_prefix = 24
        hb = random.randint(2, 6)

    lo = 2 ** (hb - 1) + 1
    hi = (2 ** hb) - 2
    if lo > hi: lo = hi
    hosts_req = random.randint(lo, hi)

    if ip_class_choice == "A":
        net_str = f"{first}.0.0.0"
    elif ip_class_choice == "B":
        second = random.randint(0, 255)
        net_str = f"{first}.{second}.0.0"
    else:
        second = random.randint(0, 255)
        third  = random.randint(0, 255)
        net_str = f"{first}.{second}.{third}.0"

    new_prefix   = 32 - hb
    mask_int     = (0xFFFFFFFF << hb) & 0xFFFFFFFF
    mask_str     = int_to_dotted(mask_int)
    block_size   = 2 ** hb
    usable_hosts = block_size - 2
    net_int      = _ip_to_int(net_str)
    default_mask_str = {8: "255.0.0.0", 16: "255.255.0.0", 24: "255.255.255.0"}[default_prefix]

    subnet2_net = net_int + block_size
    first_host  = int_to_dotted(subnet2_net + 1)
    last_host   = int_to_dotted(subnet2_net + block_size - 2)

    return {
        "net_str":        net_str,
        "hosts_req":      hosts_req,
        "ip_class":       ip_class_choice,
        "default_prefix": default_prefix,
        "default_mask":   default_mask_str,
        "hb":             hb,
        "new_prefix":     new_prefix,
        "mask_str":       mask_str,
        "block_size":     block_size,
        "usable_hosts":   usable_hosts,
        "first_host":     first_host,
        "last_host":      last_host,
    }

def gen_host_design():
    d   = _build_host_design_data()
    cls = d["ip_class"]; dp = d["default_prefix"]; dm = d["default_mask"]
    hb  = d["hb"];       np_ = d["new_prefix"];    mask = d["mask_str"]
    req = d["hosts_req"]; bs = d["block_size"];    uh = d["usable_hosts"]
    net = d["net_str"]; fh = d["first_host"];      lh = d["last_host"]

    net_int        = _ip_to_int(net)
    interesting_oi = _interesting_octet(mask)
    octet_inc      = bs >> (8 * (3 - interesting_oi))
    oi_label       = ["1st", "2nd", "3rd", "4th"][interesting_oi]
    mask_oct_val   = int(mask.split(".")[interesting_oi])
    subnet2_net    = int_to_dotted(net_int + bs)
    broadcast2     = int_to_dotted(net_int + 2 * bs - 1)
    net_parts      = net.split(".")

    def sid(i): return int_to_dotted(net_int + i * bs)
    walk_str = ", ".join(sid(i) for i in range(4)) + ", ..."

    expls = {
        "ip_class": (
            f"Look at the first octet: {net_parts[0]}\n"
            f"  1–126   → Class A\n"
            f"  128–191 → Class B\n"
            f"  192–223 → Class C\n"
            f"First octet {net_parts[0]} → Class {cls}"
        ),
        "mask_str": (
            f"Host bits = {hb}, so prefix = 32 – {hb} = /{np_}\n"
            f"/{np_} in dotted decimal = {mask}\n\n"
            f"(Class {cls} default is {dm} (/{dp}); extended by {np_-dp} bits)"
        ),
        "host_bits": (
            f"Find the smallest h where 2ʰ – 2 ≥ {req}:\n"
            f"  2{sup(hb-1)} – 2 = {(2**(hb-1))-2} — not enough\n"
            f"  2{sup(hb)} – 2 = {uh} — ✓ covers {req} hosts\n"
            f"Host bits = {hb}  (the –2 removes the network ID and broadcast)"
        ),
        "first_host": (
            f"Magic number = 256 – {mask_oct_val} = {octet_inc}  (block size in the {oi_label} octet)\n"
            f"Subnet sequence: {walk_str}\n\n"
            f"2nd subnet network ID (index 1):\n"
            f"  {net}  →  add {octet_inc} to the {oi_label} octet  →  {subnet2_net}\n\n"
            f"First usable host = subnet network + 1:\n"
            f"  {subnet2_net}  →  {fh}"
        ),
        "last_host": (
            f"2nd subnet network ID = {subnet2_net}\n"
            f"Broadcast of 2nd subnet = network + block – 1 = {broadcast2}\n\n"
            f"Last usable host = broadcast – 1:\n"
            f"  {broadcast2}  →  {lh}"
        ),
    }
    full_expl = "\n\n".join(expls[k] for k in expls)

    fields = [
        ("ip_class",   "Class",                                        cls),
        ("mask_str",   "Subnet Mask",                                  mask),
        ("host_bits",  "Host Bits",                                    str(hb)),
        ("first_host", "First Host ID in 2nd Subnet (1st non-zero)",   fh),
        ("last_host",  "Last Host ID in 2nd Subnet (1st non-zero)",    lh),
    ]

    return {
        "question": (
            f"Given a network ID and hosts required, fill in all fields.\n"
            f"(Find the host range for the 2nd subnet — a.k.a. 1st non-zero subnet.)\n\n"
            f"  Network ID:      {net}\n"
            f"  Hosts Required:  {req}"
        ),
        "type":         "subnet_full",
        "unit":         "Host-Based Subnet Design",
        "breakdown":    full_expl,
        "fields":       fields,
        "explanations": expls,
        "answer_text":  (
            f"Class={cls}  Mask={mask}  HostBits={hb}  "
            f"FirstHost={fh}  LastHost={lh}"
        ),
    }

# ── SESSION STATE DEFAULTS ────────────────────────────────────────────────────

if "quiz_active"   not in st.session_state: st.session_state.quiz_active   = False
if "unit_selector" not in st.session_state: st.session_state.unit_selector = "Practice Test"


# ── CONFIG SCREEN ─────────────────────────────────────────────────────────────

if not st.session_state.quiz_active:
    st.markdown("## Quiz Setup")

    current = st.session_state.unit_selector

    col_l, col_r = st.columns(2)
    with col_l:
        st.markdown('<div class="col-header">General</div>', unsafe_allow_html=True)
        for u in LEFT_UNITS:
            label = f"● {u}" if u == current else u
            if st.button(label, key=f"usel_{u}", use_container_width=True):
                st.session_state.unit_selector = u
                st.rerun()
    with col_r:
        st.markdown('<div class="col-header">Subnet Specific</div>', unsafe_allow_html=True)
        for u in RIGHT_UNITS:
            label = f"● {u}" if u == current else u
            if st.button(label, key=f"usel_{u}", use_container_width=True):
                st.session_state.unit_selector = u
                st.rerun()

    selected_unit = st.session_state.unit_selector
    is_all = (selected_unit == "Practice Test")

    if is_all:
        st.markdown(
            '<div style="background:#1a2233;border:1px solid #2e4a7a;border-left:4px solid #4a7acd;'
            'border-radius:7px;padding:0.75rem 1rem;font-size:0.88rem;color:#7aaee8;margin:0.75rem 0;">'
            '<strong>Practice Test (Exam Mode)</strong><br>'
            '20 questions &nbsp;·&nbsp; 2 Binary↔Decimal &nbsp;·&nbsp; 2 Hex→Decimal '
            '&nbsp;·&nbsp; 2 Decimal→Hex &nbsp;·&nbsp; 14 Subnetting<br>'
            'Subnetting mix: IP Info · Host Range &amp; Broadcast · Subnet Design · Host-Based Subnet Design (3 each + 2 random)<br>'
            'Passing score: <strong>16 / 20 (80%)</strong>'
            '</div>',
            unsafe_allow_html=True,
        )
        num_questions = ALL_TOTAL
        randomize     = True
    else:
        col1, col2 = st.columns(2)
        with col1:
            num_questions = st.slider("Number of questions", min_value=1, max_value=30, value=10, step=1)
        with col2:
            randomize = st.checkbox("Randomize order", value=True)

    st.markdown("---")
    col3, col4 = st.columns(2)
    with col3:
        use_timer = st.checkbox("Enable timer", value=False)
    with col4:
        timer_minutes = st.slider("Duration (minutes)", 1, 60, 10, disabled=not use_timer)

    instant_feedback = st.checkbox("Show correct answer after each question", value=True)

    if st.button("Start Quiz"):
        questions = generate_question_pool(selected_unit, num_questions)
        if randomize:
            random.shuffle(questions)

        st.session_state.questions        = questions
        st.session_state.q_keys           = [q["id"] for q in questions]
        st.session_state.quiz_active      = True
        st.session_state.current_q        = 0
        st.session_state.selected_answers = {}
        st.session_state.answered         = {}
        st.session_state.score            = 0
        st.session_state.start_time       = time.time()
        st.session_state.q_start_time     = time.time()
        st.session_state.elapsed_times    = []
        st.session_state.time_up          = False
        st.session_state.use_timer        = use_timer
        st.session_state.timer_seconds    = timer_minutes * 60
        st.session_state.instant_feedback = instant_feedback
        st.session_state.total            = num_questions
        st.session_state.active_unit      = selected_unit
        st.session_state.is_exam_mode     = is_all
        st.rerun()


# ── QUIZ SCREEN ───────────────────────────────────────────────────────────────

elif st.session_state.quiz_active:
    questions = st.session_state.questions
    q_keys    = st.session_state.q_keys
    total     = st.session_state.total
    idx       = st.session_state.current_q
    elapsed   = int(time.time() - st.session_state.start_time)
    q_by_id   = {q["id"]: q for q in questions}

    if st.session_state.use_timer:
        remaining = st.session_state.timer_seconds - elapsed
        if remaining <= 0 and not st.session_state.time_up:
            st.session_state.time_up   = True
            st.session_state.current_q = total
            st.rerun()

    # ── RESULTS ──────────────────────────────────────────────────────────────
    if idx >= total:
        score   = st.session_state.score
        pct     = (score / total * 100) if total else 0
        elapsed = int(time.time() - st.session_state.start_time)
        avg_t   = (
            sum(st.session_state.elapsed_times) / len(st.session_state.elapsed_times)
            if st.session_state.elapsed_times else 0
        )

        if st.session_state.get("time_up"):
            st.warning("Time expired.")

        st.markdown(f'<div class="score-big">{score} / {total}</div>', unsafe_allow_html=True)
        st.markdown(f'<div class="score-sub">{pct:.0f}% &mdash; {get_rank(pct)}</div>', unsafe_allow_html=True)

        if st.session_state.get("is_exam_mode"):
            passed = score >= ALL_PASS_SCORE
            badge_bg  = "#1a2e22" if passed else "#2e1a1a"
            badge_bdr = "#3d9e58" if passed else "#a03030"
            badge_clr = "#5ec47a" if passed else "#e06060"
            badge_txt = f"PASS — {score}/{total} ({pct:.0f}%)" if passed else f"FAIL — {score}/{total} ({pct:.0f}%)  |  Need {ALL_PASS_SCORE} to pass"
            st.markdown(
                f'<div style="background:{badge_bg};border:1px solid {badge_bdr};border-left:4px solid {badge_bdr};'
                f'border-radius:7px;padding:0.8rem 1rem;font-size:1rem;font-weight:700;color:{badge_clr};margin-bottom:1rem;">'
                f'{badge_txt}</div>',
                unsafe_allow_html=True,
            )

        st.markdown(f'''
        <div class="stat-row">
            <div class="stat-box"><div class="stat-val">{score}</div><div class="stat-lbl">Correct</div></div>
            <div class="stat-box"><div class="stat-val">{total - score}</div><div class="stat-lbl">Incorrect</div></div>
            <div class="stat-box"><div class="stat-val">{format_time(elapsed)}</div><div class="stat-lbl">Total time</div></div>
            <div class="stat-box"><div class="stat-val">{avg_t:.1f}s</div><div class="stat-lbl">Avg / question</div></div>
        </div>''', unsafe_allow_html=True)

        missed = [qid for qid in q_keys if qid in st.session_state.answered and not st.session_state.answered[qid]]
        if missed:
            with st.expander(f"Review missed questions ({len(missed)})"):
                for qid in missed:
                    q         = q_by_id[qid]
                    q_display = q.get("question", "")
                    st.markdown(f"**{q_display}**")
                    your_raw = st.session_state.selected_answers.get(qid, "Not answered")
                    st.markdown(f"<span style='color:#c0392b'>Your answer: {your_raw}</span>", unsafe_allow_html=True)
                    st.markdown(f"<span style='color:#2e7d4f'>Correct: {q['answer_text']}</span>", unsafe_allow_html=True)
                    breakdown = q.get("breakdown", "")
                    if breakdown:
                        st.markdown(
                            f'<div class="feedback-explanation" style="background:#1a1a1a;border-left:3px solid #444;'
                            f'padding:0.6rem 0.9rem;border-radius:5px;margin-top:0.4rem;">{breakdown}</div>',
                            unsafe_allow_html=True,
                        )
                    st.markdown("---")

        c1, c2 = st.columns(2)
        with c1:
            if st.button("Next Quiz"):
                reset_quiz(); st.rerun()
        with c2:
            if st.button("New Settings"):
                reset_quiz(); st.rerun()

    # ── ACTIVE QUESTION ───────────────────────────────────────────────────────
    else:
        q_key            = q_keys[idx]
        q_data           = q_by_id[q_key]
        already_answered = q_key in st.session_state.answered

        timer_str = ""
        if st.session_state.use_timer:
            remaining = st.session_state.timer_seconds - elapsed
            warn_cls  = "timer-warn" if remaining < 60 else "timer-text"
            timer_str = f'<span class="{warn_cls}">{format_time(remaining)}</span>'

        prog_col, exit_col = st.columns([8, 1])
        with prog_col:
            suffix = f"&nbsp;&nbsp;{timer_str}" if timer_str else ""
            st.markdown(
                f'<div class="progress-label">Question {idx+1} of {total} &nbsp;&middot;&nbsp; {st.session_state.score} correct{suffix}</div>',
                unsafe_allow_html=True,
            )
        with exit_col:
            if st.button("Exit", key="exit_btn", use_container_width=True):
                st.session_state.current_q = total
                st.rerun()

        st.progress(idx / total)
        st.markdown("<div style='height:0.75rem'></div>", unsafe_allow_html=True)

        q_text = q_data.get("question", "")
        st.markdown(
            f'<div class="question-card">'
            f'<div class="question-meta">{q_data["unit"]} &nbsp;&middot;&nbsp; Question {idx+1}</div>'
            f'<div class="question-text">{q_text}</div></div>',
            unsafe_allow_html=True,
        )

        # ── SUBNET FULL (text-box fields) ─────────────────────────────────────
        if q_data["type"] == "subnet_full":
            fields  = q_data["fields"]
            expls   = q_data["explanations"]
            results = st.session_state.get(f"sfr_{q_key}", {})

            for fkey, flabel, fcorrect in fields:
                user_val = st.text_input(
                    flabel, key=f"sf_{q_key}_{fkey}",
                    disabled=already_answered,
                    value=results.get(fkey, ("", "", False))[0] if already_answered else "",
                )
                if already_answered and fkey in results:
                    uv, cv, ok = results[fkey]
                    if ok:
                        st.markdown(f'<span style="color:#5ec47a;font-size:0.85rem;">✓ Correct</span>', unsafe_allow_html=True)
                    else:
                        expl_key  = {"first_host": "host_range", "last_host": "host_range"}.get(fkey, fkey)
                        expl_text = expls.get(expl_key) or expls.get(fkey, "")
                        st.markdown(
                            f'<span style="color:#e06060;font-size:0.85rem;">✗ Correct answer: {cv}</span>',
                            unsafe_allow_html=True,
                        )
                        if expl_text and st.session_state.instant_feedback:
                            st.markdown(
                                f'<div class="feedback-explanation" style="background:#1a1a1a;border-left:3px solid #444;'
                                f'padding:0.5rem 0.8rem;border-radius:5px;margin-bottom:0.5rem;">{expl_text}</div>',
                                unsafe_allow_html=True,
                            )

            btn_label = "Finish" if (already_answered and idx == total - 1) else "Submit" if not already_answered else "Next"
            if st.button(btn_label, use_container_width=True):
                if not already_answered:
                    field_results = {}
                    all_correct   = True
                    for fkey, flabel, fcorrect in fields:
                        uv = st.session_state.get(f"sf_{q_key}_{fkey}", "").strip()
                        ok = uv.upper() == fcorrect.upper()
                        field_results[fkey] = (uv, fcorrect, ok)
                        if not ok:
                            all_correct = False
                    st.session_state[f"sfr_{q_key}"] = field_results
                    st.session_state.answered[q_key]  = all_correct
                    st.session_state.selected_answers[q_key] = ", ".join(
                        f"{fl}={fres[0]}" for (fk, fl, fc), fres in zip(fields, field_results.values())
                    )
                    if all_correct:
                        st.session_state.score += 1
                    st.session_state.elapsed_times.append(time.time() - st.session_state.q_start_time)
                    if not st.session_state.instant_feedback:
                        st.session_state.current_q   += 1
                        st.session_state.q_start_time = time.time()
                    st.rerun()
                else:
                    st.session_state.current_q   += 1
                    st.session_state.q_start_time = time.time()
                    st.rerun()

        # ── TEXT INPUT (conversion questions) ─────────────────────────────────
        elif q_data["type"] == "text_input":
            placeholder = q_data.get("placeholder", "Type your answer here")
            answer_text = q_data["answer_text"]

            if already_answered:
                user_val = st.session_state.selected_answers.get(q_key, "")
                st.text_input("Your answer:", value=user_val, disabled=True, key=f"ti_display_{q_key}")
            else:
                st.text_input("Your answer:", placeholder=placeholder, key=f"ti_{q_key}")

            btn_label = "Finish" if (already_answered and idx == total - 1) else "Submit" if not already_answered else "Next"
            if st.button(btn_label, use_container_width=True):
                if not already_answered:
                    user_val = st.session_state.get(f"ti_{q_key}", "").strip()
                    if user_val:
                        is_correct = user_val.upper() == answer_text.upper()
                        st.session_state.selected_answers[q_key] = user_val
                        st.session_state.answered[q_key] = is_correct
                        if is_correct:
                            st.session_state.score += 1
                        st.session_state.elapsed_times.append(time.time() - st.session_state.q_start_time)
                        if not st.session_state.instant_feedback:
                            st.session_state.current_q   += 1
                            st.session_state.q_start_time = time.time()
                        st.rerun()
                else:
                    st.session_state.current_q   += 1
                    st.session_state.q_start_time = time.time()
                    st.rerun()

            if already_answered and st.session_state.instant_feedback:
                is_correct = st.session_state.answered[q_key]
                expl       = q_data["breakdown"]
                if is_correct:
                    st.markdown(
                        f'<div class="feedback-correct">Correct'
                        f'<div class="feedback-explanation">{expl}</div></div>',
                        unsafe_allow_html=True,
                    )
                else:
                    st.markdown(
                        f'<div class="feedback-wrong">Incorrect &mdash; correct answer: {answer_text}'
                        f'<div class="feedback-explanation">{expl}</div></div>',
                        unsafe_allow_html=True,
                    )

        # ── MCQ ───────────────────────────────────────────────────────────────
        else:
            opts          = q_data["options"]
            option_labels = [f"{k}  {v}" for k, v in opts.items()]
            default_idx   = None
            if q_key in st.session_state.selected_answers:
                saved = st.session_state.selected_answers[q_key]
                for i, lbl in enumerate(option_labels):
                    if lbl == saved:
                        default_idx = i
                        break

            st.radio("Select an answer:", option_labels, index=default_idx,
                     key=f"radio_{q_key}", disabled=already_answered)

            btn_label = "Finish" if (already_answered and idx == total - 1) else "Next"
            if st.button(btn_label, use_container_width=True):
                if not already_answered:
                    radio_val = st.session_state.get(f"radio_{q_key}")
                    if radio_val:
                        chosen_key = next((k for k, v in opts.items() if f"{k}  {v}" == radio_val), None)
                        if chosen_key:
                            st.session_state.selected_answers[q_key] = radio_val
                            is_correct = opts[chosen_key].strip() == q_data["answer_text"].strip()
                            st.session_state.answered[q_key] = is_correct
                            if is_correct:
                                st.session_state.score += 1
                            st.session_state.elapsed_times.append(time.time() - st.session_state.q_start_time)
                            if not st.session_state.instant_feedback:
                                st.session_state.current_q   += 1
                                st.session_state.q_start_time = time.time()
                            st.rerun()
                else:
                    st.session_state.current_q   += 1
                    st.session_state.q_start_time = time.time()
                    st.rerun()

            if already_answered and st.session_state.instant_feedback:
                is_correct = st.session_state.answered[q_key]
                expl       = q_data["breakdown"]
                if is_correct:
                    st.markdown(
                        f'<div class="feedback-correct">Correct'
                        f'<div class="feedback-explanation">{expl}</div></div>',
                        unsafe_allow_html=True,
                    )
                else:
                    st.markdown(
                        f'<div class="feedback-wrong">Incorrect &mdash; correct answer: {q_data["answer_text"]}'
                        f'<div class="feedback-explanation">{expl}</div></div>',
                        unsafe_allow_html=True,
                    )

        if st.session_state.use_timer and not already_answered:
            time.sleep(0.5)
            st.rerun()
    </script>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

      mount(
        {
          entrypoint: "streamlit_app.py",
          files: {
            "streamlit_app.py": document.getElementById("app-source").textContent,
          },
          requirements: ["pyodide-http"],
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
