# ── HELPERS ───────────────────────────────────────────────────────────────────

def _derive_keys(passphrase: str):
    master  = hashlib.sha256(passphrase.encode()).digest()
    enc_key = hashlib.sha256(master + b"enc").digest()
    mac_key = hashlib.sha256(master + b"mac").digest()
    return enc_key, mac_key


def decrypt_text(token: str, passphrase: str) -> str:
    enc_key, mac_key = _derive_keys(passphrase)
    raw = base64.urlsafe_b64decode(token.encode())
    iv         = raw[:16]
    mac        = raw[-32:]
    ciphertext = raw[16:-32]
    expected_mac = hmac.new(mac_key, iv + ciphertext, hashlib.sha256).digest()
    if not hmac.compare_digest(expected_mac, mac):
        raise ValueError("MAC verification failed — wrong passphrase or corrupted data.")
    plaintext = bytearray()
    block_index = 0
    offset = 0
    keystream = b""
    for byte in ciphertext:
        if offset >= len(keystream):
            counter_bytes = struct.pack(">Q", block_index)
            keystream = hashlib.sha256(enc_key + iv + counter_bytes).digest()
            block_index += 1
            offset = 0
        plaintext.append(byte ^ keystream[offset])
        offset += 1
    return plaintext.decode("utf-8")


def get_last_modified(url: str) -> str:
    try:
        req = urllib.request.Request(url, method="HEAD")
        with urllib.request.urlopen(req) as resp:
            return resp.headers.get("Last-Modified", "unknown")
    except Exception:
        return "unknown"


@st.cache_data
def load_questions(passphrase: str, url: str, last_modified: str) -> dict:
    """Fetch and decrypt questions for a given URL. Cached per (passphrase, url, last_modified)."""
    with urllib.request.urlopen(url) as resp:
        data = json.loads(resp.read().decode("utf-8"))
    questions = data["questions"]
    for q_data in questions.values():
        q_data["question"] = decrypt_text(q_data["question"], passphrase)
        q_data["options"]  = {k: decrypt_text(v, passphrase) for k, v in q_data["options"].items()}
        q_data["answer"]   = {k: decrypt_text(v, passphrase) for k, v in q_data["answer"].items()}
    return questions


def get_mastered_key(unit: str) -> str:
    """Session-state key for the mastered set of a given unit scope."""
    return f"mastered_keys_{unit}"


def shuffle_question_options(q_data: dict) -> dict:
    import copy
    q = copy.deepcopy(q_data)
    keys   = list(q["options"].keys())
    values = list(q["options"].values())
    correct_text = q["options"][list(q["answer"].keys())[0]]
    random.shuffle(values)
    q["options"] = dict(zip(keys, values))
    new_correct_key = next(k for k, v in q["options"].items() if v == correct_text)
    q["answer"] = {new_correct_key: list(q["answer"].values())[0]}
    return q


def format_time(seconds: int) -> str:
    m, s = divmod(max(0, seconds), 60)
    return f"{m:02d}:{s:02d}"


def get_rank(pct: float) -> str:
    if pct >= 90:   return "Excellent"
    elif pct >= 80: return "Good"
    elif pct >= 70: return "Satisfactory"
    elif pct >= 60: return "Marginal"
    else:           return "Needs improvement"


def reset_quiz():
    random.seed()
    """Reset the current quiz run while preserving mastered sets, passphrase, decryption status, num_questions pref, and all settings."""
    preserved = {
        "decryption_ok":        st.session_state.get("decryption_ok", False),
        "passphrase":           st.session_state.get("passphrase", ""),
        "unit_selector":        st.session_state.get("active_unit", st.session_state.get("unit_selector", "All Question Sets")),
        "pref_num_questions":   st.session_state.get("pref_num_questions", 10),
        # Persist all settings across quiz resets
        "cfg_randomize":        st.session_state.get("cfg_randomize", True),
        "cfg_use_timer":        st.session_state.get("cfg_use_timer", False),
        "cfg_timer_minutes":    st.session_state.get("cfg_timer_minutes", 10),
        "cfg_instant_feedback": st.session_state.get("cfg_instant_feedback", True),
        "cfg_start_at":         st.session_state.get("cfg_start_at", 1),
    }
    for unit in UNIT_OPTIONS:
        mk = get_mastered_key(unit)
        preserved[mk] = st.session_state.get(mk, set())
    for key in list(st.session_state.keys()):
        del st.session_state[key]
    for k, v in preserved.items():
        st.session_state[k] = v


def full_reset():
    for key in list(st.session_state.keys()):
        del st.session_state[key]

if not st.session_state.decryption_ok:

    if st.button("Unlock Quiz"):
        try:
            # Validate key against the "All" URL; raises ValueError on bad key

            lm = get_last_modified(test_url)
            load_questions(passphrase_input, test_url, lm)
            st.session_state.passphrase    = passphrase_input
            st.session_state.decryption_ok = True
            st.success("Quiz unlocked successfully.")
            st.rerun()
        except Exception:
            st.error("Invalid key. Unable to decrypt quiz.")

    st.stop()


# ── CONFIG SCREEN ─────────────────────────────────────────────────────────────

if not st.session_state.quiz_active:
    st.markdown("## Quiz Setup")

    # ── Unit selector ─────────────────────────────────────────────────────────
    if "unit_selector" not in st.session_state:
        st.session_state.unit_selector = st.session_state.get("last_selected_unit", "All Question Sets")

    selected_unit = st.radio(
        "Select unit",
        UNIT_OPTIONS,
        horizontal=True,
        key="unit_selector",
    )
    st.session_state.last_selected_unit = selected_unit

    # Load questions for the selected unit (cached after first fetch per unit)
    _url      = UNIT_URLS[selected_unit]
    _lm       = get_last_modified(_url)
    unit_pool = load_questions(st.session_state.passphrase, _url, _lm)

    # Per-unit mastered set — completely isolated from other units
    mastered_key = get_mastered_key(selected_unit)
    if mastered_key not in st.session_state:
        st.session_state[mastered_key] = set()
    mastered_set = st.session_state[mastered_key]

    total_available = len(unit_pool)
    mastered_count  = len(mastered_set)
    available_count = total_available - mastered_count

    # Auto-reset pool if every question in this unit has been mastered
    if total_available > 0 and available_count == 0:
        st.session_state[mastered_key] = set()
        mastered_set    = set()
        mastered_count  = 0
        available_count = total_available
        st.info(f"All questions in {selected_unit} have been mastered! The pool has been reset.")

    if mastered_count > 0:
        st.markdown(
            f'<div class="mastered-banner">'
            f'<strong>{mastered_count}</strong> question{"s" if mastered_count != 1 else ""} mastered '
            f'({selected_unit}) &mdash; '
            f'<strong>{available_count}</strong> remaining in pool.</div>',
            unsafe_allow_html=True,
        )

    # ── Read all settings from session_state (set by widgets on prior run) ──────
    # These are the "committed" values from the last render; widgets below will
    # update them for the *next* render. On very first run, defaults apply.
    randomize        = st.session_state.get("cfg_randomize", True)
    use_timer        = st.session_state.get("cfg_use_timer", False)
    timer_minutes    = st.session_state.get("cfg_timer_minutes", 10)
    instant_feedback = st.session_state.get("cfg_instant_feedback", True)
    start_at         = st.session_state.get("cfg_start_at", 1)

    # Clamp start_at to valid range
    start_at = max(1, min(start_at, available_count))

    # Effective pool size after resume offset
    effective_available = available_count - (start_at - 1) if not randomize else available_count
    effective_available = max(1, effective_available)

    num_questions = max(1, min(st.session_state.get("pref_num_questions", 10), effective_available))

    # ── Divider + Start / Reset buttons (rendered BEFORE settings widgets) ────
    st.markdown("---")

    if st.button("Start Quiz", use_container_width=True):
        random.seed()
        available_keys = [k for k in unit_pool if k not in mastered_set]

        if randomize:
            random.shuffle(available_keys)
            chosen = available_keys[:num_questions]
            pre_master_keys = []
        else:
            pre_master_keys = available_keys[:start_at - 1]
            remaining_keys  = available_keys[start_at - 1:]
            chosen = remaining_keys[:num_questions]

        if pre_master_keys:
            st.session_state[mastered_key].update(pre_master_keys)

        st.session_state.questions        = {k: shuffle_question_options(unit_pool[k]) for k in chosen}
        st.session_state.q_keys           = chosen
        st.session_state.quiz_active      = True
        st.session_state.current_q        = 0
        st.session_state.selected_answers = {}
        st.session_state.answered         = {}
        st.session_state.score            = 0
        st.session_state.start_time       = time.time()
        st.session_state.q_start_time     = time.time()
        st.session_state.elapsed_times    = []
        st.session_state.time_up          = False
        st.session_state.use_timer        = use_timer
        st.session_state.timer_seconds    = timer_minutes * 60
        st.session_state.instant_feedback = instant_feedback
        st.session_state.total            = num_questions
        st.session_state.active_unit      = selected_unit
        st.rerun()

    # ── Settings expander (rendered after button — appears below it) ──────────
    with st.expander("Settings", expanded=st.session_state.get("settings_open", True)):

        col_rand, col_timer_chk = st.columns(2)
        with col_rand:
            new_randomize = st.checkbox("Randomize order", value=randomize, key="randomize_chk")
            st.session_state["cfg_randomize"] = new_randomize
        with col_timer_chk:
            new_use_timer = st.checkbox("Enable timer", value=use_timer)
            st.session_state["cfg_use_timer"] = new_use_timer

        # Resume / start-at — sequential mode only
        if not new_randomize and available_count > 1:
            max_start = available_count
            st.markdown(
                '<div class="resume-banner">'
                '<strong>Resume from question:</strong> Questions before this number will be marked as mastered '
                'so they are skipped on restart. Set to 1 to start from the beginning.</div>',
                unsafe_allow_html=True,
            )
            new_start_at = st.number_input(
                f"Start at question # (1 – {max_start})",
                min_value=1,
                max_value=max_start,
                value=start_at,
                step=1,
                key="start_at_input",
            )
            st.session_state["cfg_start_at"] = int(new_start_at)
            eff_avail = max(1, available_count - (int(new_start_at) - 1))
        else:
            st.session_state["cfg_start_at"] = 1
            eff_avail = available_count

        # Question count
        def _sync_from_slider():
            v = st.session_state["slider_num_q"]
            st.session_state["pref_num_questions"]  = v
            st.session_state["number_input_num_q"]  = v

        def _sync_from_input():
            v = int(st.session_state["number_input_num_q"])
            st.session_state["pref_num_questions"] = v
            st.session_state["slider_num_q"]       = v

        col1, col2 = st.columns(2)
        with col1:
            if eff_avail <= 1:
                st.markdown(f"**Number of questions:** {eff_avail} *(only {eff_avail} remaining)*")
                st.session_state["pref_num_questions"] = eff_avail
            else:
                clamped = max(1, min(st.session_state.get("pref_num_questions", 10), eff_avail))
                st.session_state["pref_num_questions"] = clamped
                st.session_state["slider_num_q"]       = clamped
                st.session_state["number_input_num_q"] = clamped

                st.slider(
                    "Number of questions",
                    min_value=1,
                    max_value=eff_avail,
                    step=5 if eff_avail >= 10 else 1,
                    key="slider_num_q",
                    on_change=_sync_from_slider,
                )
                st.number_input(
                    "Or type an exact number",
                    min_value=1,
                    max_value=eff_avail,
                    step=1,
                    key="number_input_num_q",
                    on_change=_sync_from_input,
                )

        with col2:
            new_timer_minutes = st.slider("Duration (minutes)", 1, 60, timer_minutes, disabled=not new_use_timer)
            st.session_state["cfg_timer_minutes"] = new_timer_minutes

        new_instant = st.checkbox("Show correct answer after each question", value=instant_feedback)
        st.session_state["cfg_instant_feedback"] = new_instant

        st.markdown(f"*{available_count} questions available (excluding mastered) in **{selected_unit}***")

        if mastered_count > 0:
            st.markdown("<div style='height:0.4rem'></div>", unsafe_allow_html=True)
            if st.button("Reset Mastered", key="reset_mastered_btn", use_container_width=True):

                st.rerun()


# ── QUIZ SCREEN ───────────────────────────────────────────────────────────────

elif st.session_state.quiz_active:
    questions    = st.session_state.questions
    q_keys       = st.session_state.q_keys
    total        = st.session_state.total
    idx          = st.session_state.current_q
    active_unit  = st.session_state.get("active_unit", "All Question Sets")
    mastered_key = get_mastered_key(active_unit)
    if mastered_key not in st.session_state:
        st.session_state[mastered_key] = set()

    # Unit pool needed for result-screen counts (cached, no extra network hit)
    _url      = UNIT_URLS[active_unit]
    _lm       = get_last_modified(_url)
    unit_pool = load_questions(st.session_state.passphrase, _url, _lm)

    elapsed = int(time.time() - st.session_state.start_time)

    if st.session_state.use_timer:
        remaining = st.session_state.timer_seconds - elapsed
        if remaining <= 0 and not st.session_state.time_up:
            st.session_state.time_up   = True
            st.session_state.current_q = total
            st.rerun()

    # ── RESULTS ──────────────────────────────────────────────────────────────
    if idx >= total:
        score   = st.session_state.score
        pct     = (score / total * 100) if total else 0
        elapsed = int(time.time() - st.session_state.start_time)
        avg_t   = (
            sum(st.session_state.elapsed_times) / len(st.session_state.elapsed_times)
            if st.session_state.elapsed_times else 0
        )

        if not st.session_state.get("results_processed"):
            newly_mastered = [k for k in q_keys if st.session_state.answered.get(k) is True]
            st.session_state[mastered_key].update(newly_mastered)
            if len(st.session_state[mastered_key]) >= len(unit_pool):
                st.session_state[mastered_key] = set()
                st.info(f"You've mastered every question in {active_unit}! The pool has been reset.")
            st.session_state.newly_mastered_count = len(newly_mastered)
            st.session_state.results_processed = True

        newly_mastered_count = st.session_state.get("newly_mastered_count", 0)
        mastered_total = len(st.session_state[mastered_key])

        if st.session_state.get("time_up"):
            st.warning("Time expired.")

        st.markdown(f'<div class="score-big">{score} / {total}</div>', unsafe_allow_html=True)
        st.markdown(f'<div class="score-sub">{pct:.0f}% &mdash; {get_rank(pct)}</div>', unsafe_allow_html=True)

        mastered_total = len(st.session_state[mastered_key])
        if newly_mastered_count > 0:
            st.markdown(
                f'<div class="mastered-banner">'
                f'<strong>{newly_mastered_count}</strong> question{"s" if newly_mastered_count != 1 else ""} added to mastered '
                f'({active_unit}) &mdash; '
                f'<strong>{mastered_total}</strong> mastered total out of {len(unit_pool)}.</div>',
                unsafe_allow_html=True,
            )

        st.markdown(f'''
        <div class="stat-row">
            <div class="stat-box"><div class="stat-val">{score}</div><div class="stat-lbl">Correct</div></div>
            <div class="stat-box"><div class="stat-val">{total - score}</div><div class="stat-lbl">Incorrect</div></div>
            <div class="stat-box"><div class="stat-val">{format_time(elapsed)}</div><div class="stat-lbl">Total time</div></div>
            <div class="stat-box"><div class="stat-val">{avg_t:.1f}s</div><div class="stat-lbl">Avg / question</div></div>
        </div>''', unsafe_allow_html=True)

        missed = [k for k in q_keys if k in st.session_state.answered and not st.session_state.answered[k]]
        if missed:
            with st.expander(f"Review missed questions ({len(missed)})"):
                for k in missed:
                    q           = questions[k]
                    correct_key = list(q["answer"].keys())[0]
                    your_raw    = st.session_state.selected_answers.get(k, "Not answered")
                    st.markdown(f"**{q['question']}**")
                    st.markdown(f"<span style='color:#c0392b'>Your answer: {your_raw}</span>", unsafe_allow_html=True)
                    st.markdown(f"<span style='color:#2e7d4f'>Correct: {correct_key} {list(q['answer'].values())[0]}</span>", unsafe_allow_html=True)
                    st.markdown("---")

        c1, c2 = st.columns(2)
        with c1:
            if st.button("Next Quiz"):
                reset_quiz()
                st.rerun()
        with c2:
            if st.button("New Settings"):
                reset_quiz()
                st.rerun()

    # ── ACTIVE QUESTION ───────────────────────────────────────────────────────
    else:
        q_key            = q_keys[idx]
        q_data           = questions[q_key]
        opts             = q_data["options"]
        correct_key      = list(q_data["answer"].keys())[0]
        already_answered = q_key in st.session_state.answered

        timer_str = ""
        if st.session_state.use_timer:
            remaining = st.session_state.timer_seconds - elapsed
            warn_cls  = "timer-warn" if remaining < 60 else "timer-text"
            timer_str = f'<span class="{warn_cls}">{format_time(remaining)}</span>'

        prog_col, exit_col = st.columns([8, 1])
        with prog_col:
            suffix = f"&nbsp;&nbsp;{timer_str}" if timer_str else ""
            score_display = f" &nbsp;&middot;&nbsp; {st.session_state.score} correct" if st.session_state.instant_feedback else ""
            st.markdown(
                f'<div class="progress-label">Question {idx+1} of {total}{score_display}{suffix}</div>',
                unsafe_allow_html=True,
            )
        with exit_col:
            if st.button("Exit", key="exit_btn", use_container_width=True):
                st.session_state.current_q = total
                st.rerun()

        st.progress(idx / total)
        st.markdown("<div style='height:0.75rem'></div>", unsafe_allow_html=True)
        st.markdown(
            f'<div class="question-card"><div class="question-meta">Question {idx+1}</div>'
            f'<div class="question-text">{q_data["question"]}</div></div>',
            unsafe_allow_html=True,
        )

        option_labels = [f"{k}  {v}" for k, v in opts.items()]
        default_idx   = None
        if q_key in st.session_state.selected_answers:
            saved = st.session_state.selected_answers[q_key]
            for i, lbl in enumerate(option_labels):
                if lbl == saved:
                    default_idx = i
                    break

        st.radio("Select an answer:", option_labels, index=default_idx,
                 key=f"radio_{q_key}", disabled=already_answered)

        btn_label = "Finish" if (already_answered and idx == total - 1) else "Next"
        if st.button(btn_label, use_container_width=True):
            if not already_answered:
                radio_val = st.session_state.get(f"radio_{q_key}")
                if radio_val:
                    chosen_key = next((ok for ok, ov in opts.items() if f"{ok}  {ov}" == radio_val), None)
                    if chosen_key:
                        st.session_state.selected_answers[q_key] = radio_val
                        is_correct = chosen_key == correct_key
                        st.session_state.answered[q_key] = is_correct
                        if is_correct:
                            st.session_state.score += 1
                        st.session_state.elapsed_times.append(time.time() - st.session_state.q_start_time)
                        if not st.session_state.instant_feedback:
                            st.session_state.current_q    += 1
                            st.session_state.q_start_time  = time.time()
                        st.rerun()
            else:
                st.session_state.current_q   += 1
                st.session_state.q_start_time = time.time()
                st.rerun()

        if already_answered and st.session_state.instant_feedback:
            is_correct = st.session_state.answered[q_key]
            expl       = list(q_data["answer"].values())[0]
            if is_correct:
                st.markdown(
                    f'<div class="feedback-correct">Correct'
                    f'<div class="feedback-explanation">{expl}</div></div>',
                    unsafe_allow_html=True,
                )
            else:
                st.markdown(
                    f'<div class="feedback-wrong">Incorrect &mdash; correct answer: {correct_key}  {opts.get(correct_key, "")}'
                    f'<div class="feedback-explanation">{expl}</div></div>',
                    unsafe_allow_html=True,
                )

        if st.session_state.use_timer and not already_answered:
            time.sleep(0.5)
            st.rerun()
    </script>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

      mount(
        {
          entrypoint: "streamlit_app.py",
          files: {
            "streamlit_app.py": document.getElementById("app-source").textContent,
          },
          requirements: ["pyodide-http"],
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
